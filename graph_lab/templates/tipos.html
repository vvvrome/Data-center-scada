{% extends "base.html" %}

{% block title %}
Tipos de gráfica | Python Graph Lab
{% endblock %}

{% block content %}

<h2>Tipos de gráfica</h2>

<p>
    Introduce tus datos y selecciona cómo quieres representarlos.
</p>


<form method="POST">

    <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
    >
    
    <label for="x">
        Valores X
    </label>

    <input
        type="text"
        id="x"
        name="x"
        placeholder="1, 2, 3, 4, 5"
        required
    >


    <label for="y">
        Valores Y
    </label>

    <input
        type="text"
        id="y"
        name="y"
        placeholder="2, 4, 6, 8, 10"
        required
    >


    <label for="tipo">
        Tipo de gráfica
    </label>

    <select id="tipo" name="tipo">

        <option value="linea">
            Línea
        </option>

        <option value="scatter">
            Dispersión
        </option>

        <option value="barras">
            Barras
        </option>

    </select>


    <label for="titulo">
        Título
    </label>

    <input
        type="text"
        id="titulo"
        name="titulo"
        value="Mi gráfica"
    >


    <label for="nombre_x">
        Nombre del eje X
    </label>

    <input
        type="text"
        id="nombre_x"
        name="nombre_x"
        value="X"
    >


    <label for="nombre_y">
        Nombre del eje Y
    </label>

    <input
        type="text"
        id="nombre_y"
        name="nombre_y"
        value="Y"
    >


    <button type="submit">
        Generar gráfica
    </button>


</form>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


{% if grafica %}

<div class="resultado">

    <h2>Resultado</h2>

    <img
        src="{{ url_for('static', filename=grafica) }}"
        alt="Gráfica generada"
    >

</div>

{% endif %}

{% endblock %}
